[project]
name = "nexai"
version = "0.1.0"
description = "NexAI maze controller optimizer with isolated demo_engine sandbox"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcade>=2.6.0",
    "google-generativeai>=0.8.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "psutil>=5.9.0",
    "pynput>=1.7.6",
    "python-dotenv>=1.0.0",
]

[project.scripts]
nexai = "NexAI.optimizer.runner:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["NexAI*", "demo_engine*"]
